name: Release

on:
  push:
    branches: [main, next, beta]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags and GitHub releases
      issues: write # comment on released issues
      pull-requests: write # comment on released pull requests
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # NOTE: no `registry-url` here on purpose. setup-node would write an .npmrc
      # with a NODE_AUTH_TOKEN placeholder, which shadows OIDC detection.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@^11.5.1 && npm --version

      - run: npm ci
      - run: npm run build
      - name: Prepare unscoped alias package (openbao-js)
        run: npm run prepare-alias

      - name: Verify dependency signatures
        run: npm audit signatures

      # Authentication order (per package):
      #   1. OIDC trusted publishing — used automatically once a trusted publisher
      #      is configured on npmjs.com for that package.
      #   2. NPM_TOKEN secret — needed only for the very first publish (the
      #      packages must exist before a trusted publisher can be attached).
      #      Remove the secret afterwards.
      #
      # @semantic-release/git pushes a "chore(release): x.y.z" commit with
      # CHANGELOG.md; its message carries GitHub's CI-skip marker so the push
      # does not start this workflow again. Avoid writing that marker in other
      # commit messages: GitHub skips CI for any head commit containing it.
      - name: Semantic release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Heals partial releases: publishes any package name still missing the
      # latest tagged version (built from the tag's source). No-op normally.
      - name: Ensure all package names are published
        if: github.ref == 'refs/heads/main'
        run: ./scripts/ensure-published.sh
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  docs:
    name: Deploy API docs
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, so the docs show the released version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Stamp released version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
          [ -n "$VERSION" ] && npm pkg set version="$VERSION" || true
      - run: npm run docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5

name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, next, beta] # release.yml runs the same checks on release branches
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
        if: matrix.node == 24
      - run: npm test
      - run: npm run build
      - name: Build API docs (fails on TypeDoc warnings)
        if: matrix.node == 24
        run: npm run docs
      - name: Smoke test ESM + CJS entry points
        run: |
          node -e "import('./dist/index.js').then(m => { if (typeof m.OpenBao !== 'function') process.exit(1) })"
          node -e "const m = require('./dist/index.cjs'); if (typeof m.OpenBao !== 'function') process.exit(1)"

  integration:
    name: Integration (OpenBao ${{ matrix.openbao }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openbao: ['2.6.5', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start OpenBao dev server
        run: |
          docker run -d --name openbao -p 8200:8200 --cap-add IPC_LOCK \
            openbao/openbao:${{ matrix.openbao }} \
            server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8200/v1/sys/health >/dev/null && exit 0
            sleep 1
          done
          docker logs openbao
          exit 1
      - run: npm run test:integration
        env:
          BAO_ADDR: http://127.0.0.1:8200
          BAO_TOKEN: root
      - if: failure()
        run: docker logs openbao
